name: Compilar APK Android

# Compila la app Android (Trusted Web Activity) que abre YARBIS a pantalla completa.
# Se ejecuta a mano (Actions → "Compilar APK Android" → Run workflow) o al cambiar android/.
on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 13.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # Firma: usa la llave guardada en los secretos del repo si existe
      # (KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD).
      # Si no, crea una llave temporal: el APK funciona, pero para instalar
      # una versión nueva hay que desinstalar la anterior.
      - name: Preparar llave de firma
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          KS="$RUNNER_TEMP/release.keystore"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$KS"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          else
            echo "::warning::Sin llave guardada en los secretos: se usa una llave temporal."
            PASS="yarbis-$(openssl rand -hex 12)"
            keytool -genkeypair -v -keystore "$KS" -alias yarbis -keyalg RSA -keysize 2048 \
              -validity 10000 -storepass "$PASS" -keypass "$PASS" \
              -dname "CN=YARBIS, O=YARBIS, C=VE"
            echo "::add-mask::$PASS"
            echo "KEYSTORE_PASSWORD=$PASS" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=yarbis" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$PASS" >> "$GITHUB_ENV"
          fi
          echo "KEYSTORE_FILE=$KS" >> "$GITHUB_ENV"

      - name: Compilar
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Huella SHA-256 (para assetlinks.json)
        run: |
          keytool -list -v -keystore "$KEYSTORE_FILE" -alias "$KEY_ALIAS" -storepass "$KEYSTORE_PASSWORD" \
            | grep 'SHA256:' | tee fingerprint.txt
          cp android/app/build/outputs/apk/release/app-release.apk YARBIS.apk

      - uses: actions/upload-artifact@v4
        with:
          name: YARBIS-apk
          path: |
            YARBIS.apk
            fingerprint.txt

      - name: Publicar en Releases
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="apk-v${VERSION_NAME}"
          gh release create "$TAG" YARBIS.apk \
            --title "YARBIS para Android ${VERSION_NAME}" \
            --notes "Descarga **YARBIS.apk** en tu teléfono Android y ábrelo para instalar (permite \"instalar apps desconocidas\" si te lo pide)." \
            --latest
