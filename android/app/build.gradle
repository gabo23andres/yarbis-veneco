// YARBIS para Android: Trusted Web Activity (TWA).
// Abre https://gabo23andres.github.io/yarbis-veneco/ con Chrome a pantalla
// completa, así funcionan el micrófono, la cámara y las notificaciones.
plugins {
    id 'com.android.application'
}

def twa = [
    host      : 'gabo23andres.github.io',
    startUrl  : 'https://gabo23andres.github.io/yarbis-veneco/',
    themeColor: '#070A12'
]

android {
    namespace 'io.github.gabo23andres.yarbis'
    compileSdk 34

    defaultConfig {
        applicationId 'io.github.gabo23andres.yarbis'
        minSdk 21
        targetSdk 34
        versionCode((System.getenv('VERSION_CODE') ?: '1').toInteger())
        versionName(System.getenv('VERSION_NAME') ?: '15.0.0')

        resValue 'string', 'appName', 'YARBIS'
        resValue 'string', 'launchUrl', twa.startUrl
        resValue 'string', 'assetStatements',
            '[{ \\"relation\\": [\\"delegate_permission/common.handle_all_urls\\"], \\"target\\": {\\"namespace\\": \\"web\\", \\"site\\": \\"https://' + twa.host + '\\"}}]'
        resValue 'color', 'colorPrimary', twa.themeColor
        resValue 'color', 'navigationColor', twa.themeColor
    }

    signingConfigs {
        release {
            storeFile file(System.getenv('KEYSTORE_FILE') ?: 'release.keystore')
            storePassword System.getenv('KEYSTORE_PASSWORD')
            keyAlias System.getenv('KEY_ALIAS')
            keyPassword System.getenv('KEY_PASSWORD')
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
}
